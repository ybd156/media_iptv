# JVM
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false
# 注意：不要开启 org.gradle.configuration-cache。
# 实测在 AGP 8.2.2 下会失败：
#   Configuration cache state could not be cached: field `__classpath__` of
#   com.android.build.gradle.internal.lint.LintTool bean found in field `__lintTool__`
#   of task `:app:lintVitalAnalyzeRelease` ... error writing value of type
#   'DefaultConfigurableFileCollection'
# 待 AGP 升到 8.7+（见 android/build.gradle.kts 的说明）后再启用。

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# ============================ 网络代理（按需启用）============================
# 本机外网只能经 SOCKS5 127.0.0.1:10808，需要联网拉依赖时取消下面两行注释再构建。
# 默认保持注释：代理地址是机器相关的，且代理未运行时启用它会让构建直接失败。
# systemProp.socksProxyHost=127.0.0.1
# systemProp.socksProxyPort=10808

# ============================ 发布签名 ============================
# 未签名的 APK 在 Android 上根本装不上，而「客户端自动更新」必须能装上才有意义，
# 所以构建 release 一定要有密钥。
#
# ⚠️ 密钥与密码都**不进这个仓库**：
#   - android/release.jks 由 .gitignore 的 *.jks 挡住；
#   - 密码原先以明文写在本文件里，已移除。密钥密码泄露的后果不是"别人能看到代码"，
#     而是**别人能签出一个版本号更高、能覆盖安装到你电视上的"更新包"** ——
#     本项目的客户端更新链路会主动提示并下载安装，等于把更新通道的钥匙交出去。
#
# 本机构建时这样提供（三选一，都不会进仓库）：
#   1) android/signing.env（推荐；模板见 android/signing.env.example）：
#        RELEASE_STORE_PASSWORD=******
#        RELEASE_KEY_PASSWORD=******
#      android/build-on-nas.sh 会自动读它并转交给 Gradle；
#   2) 用户级 ~/.gradle/gradle.properties（Gradle 自动读，优先级高于本文件）：
#        RELEASE_STORE_FILE=/abs/path/to/release.jks
#        RELEASE_STORE_PASSWORD=******
#        RELEASE_KEY_ALIAS=mediaiptv
#        RELEASE_KEY_PASSWORD=******
#   3) 环境变量：ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD=******
#
# 换密钥后签名不同，已装的客户端无法覆盖升级，必须先卸载旧版。
# 密钥文件自己备份一份：它不在仓库里，丢了就再也签不出能覆盖安装的包。
